<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL Shortener</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; }
  button { padding: 8px 12px; cursor: pointer; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  #result { margin-top: 16px; display: none; }
  #error { margin-top: 16px; color: #c00; display: none; }
  a { word-break: break-all; }
</style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="form">
    <label for="url" class="visually-hidden">Long URL</label>
<label for="url">URL</label>
    <input type="url" id="url" placeholder="https://example.com" required />
    <button type="submit">Shorten</button>
  </form>
  <div id="error"></div>
  <div id="result">
    <a id="short" href="#" target="_blank" rel="noopener" aria-label="Shortened link"></a>
    <button id="copy">Copy</button>
  </div>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const result = document.getElementById('result');
    const shortLink = document.getElementById('short');
    const copyBtn = document.getElementById('copy');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.style.display = 'none';
      result.style.display = 'none';
      const url = input.value.trim();
      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl;
        result.style.display = 'block';
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortLink.href);
        copyBtn.textContent = 'Copied';
        setTimeout(() => (copyBtn.textContent = 'Copy'), 1500);
      } catch {
        copyBtn.textContent = 'Failed';
      }
    });
  </script>
</body>
</html>
